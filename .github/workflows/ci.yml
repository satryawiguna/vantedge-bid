name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vantedge
          POSTGRES_PASSWORD: vantedge
          POSTGRES_DB: vantedge
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vantedge"
          --health-interval 5s --health-timeout 3s --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgres://vantedge:vantedge@localhost:5432/vantedge
      REDIS_URL: redis://localhost:6379
      STORAGE_DRIVER: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Apply migrations to a scratch database
        run: npm run migrate

      # Runs the unit suite plus the schema-drift guard, which only activates
      # once DATABASE_URL points at a migrated database (see
      # test/integration/schema-drift.spec.ts and ADR 0001).
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
