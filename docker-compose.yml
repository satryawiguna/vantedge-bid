name: vantedge-bid

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vantedge
      POSTGRES_PASSWORD: vantedge
      POSTGRES_DB: vantedge
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vantedge -d vantedge']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # appendonly keeps queued jobs across a restart. Without it a container
    # bounce silently drops every job that had not yet been processed.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: runtime
    command: ['node', 'dist/database/migrator']
    environment:
      DATABASE_URL: postgres://vantedge:vantedge@postgres:5432/vantedge
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: tender-documents
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      target: runtime
    command: ['node', 'dist/main']
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgres://vantedge:vantedge@postgres:5432/vantedge
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: tender-documents
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
      STORAGE_FORCE_PATH_STYLE: 'true'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Scale with: docker compose up -d --scale worker=4
  # Nothing in the worker is singleton-bound; adding replicas adds throughput.
  worker:
    build:
      context: .
      target: runtime
    command: ['node', 'dist/worker']
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://vantedge:vantedge@postgres:5432/vantedge
      # Workers hold one pool connection per concurrent job; sizing the pool
      # below the Postgres max_connections is what keeps a scale-up from
      # exhausting the database instead of the queue.
      DATABASE_POOL_SIZE: '6'
      REDIS_URL: redis://redis:6379
      INGESTION_CONCURRENCY: '5'
      STORAGE_DRIVER: s3
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: tender-documents
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
      STORAGE_FORCE_PATH_STYLE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
  minio-data:
