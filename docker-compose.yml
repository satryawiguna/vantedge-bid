name: vantedge-bid

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vantedge
      POSTGRES_PASSWORD: vantedge
      POSTGRES_DB: vantedge
    ports:
      # Host port is overridable (POSTGRES_HOST_PORT=5433) when 5432 is taken.
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vantedge -d vantedge']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # appendonly keeps queued jobs across a restart. Without it a container
    # bounce silently drops every job that had not yet been processed.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      # Host port is overridable (REDIS_HOST_PORT=6380) when 6379 is taken.
      - '${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: runtime
    command: ['node', 'dist/database/migrator']
    environment:
      DATABASE_URL: postgres://vantedge:vantedge@postgres:5432/vantedge
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      target: runtime
    command: ['node', 'dist/main']
    environment:
      # `production` unless overridden. Demo mode (GET /v1/demo/organizations) is
      # refused under production, so to try it in Docker set both
      # DEMO_MODE=true and API_NODE_ENV=demo (e.g. in .env). Off by default.
      NODE_ENV: ${API_NODE_ENV:-production}
      DEMO_MODE: ${DEMO_MODE:-false}
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgres://vantedge:vantedge@postgres:5432/vantedge
      REDIS_URL: redis://redis:6379
      # Local-disk storage on a shared volume. MinIO's public image is no longer
      # published, so Compose does not run an S3 service; point STORAGE_DRIVER=s3
      # at any S3-compatible endpoint to use that driver instead. The local driver
      # is single-host: every api/worker replica must mount the same volume.
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: /data/storage
      STORAGE_BUCKET: tender-documents
    ports:
      - '3000:3000'
    volumes:
      - storage-data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Scale with: docker compose up -d --scale worker=4
  # Nothing in the worker is singleton-bound; adding replicas adds throughput.
  worker:
    build:
      context: .
      target: runtime
    command: ['node', 'dist/worker']
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://vantedge:vantedge@postgres:5432/vantedge
      # Workers hold one pool connection per concurrent job; sizing the pool
      # below the Postgres max_connections is what keeps a scale-up from
      # exhausting the database instead of the queue.
      DATABASE_POOL_SIZE: '6'
      REDIS_URL: redis://redis:6379
      INGESTION_CONCURRENCY: '5'
      # Local-disk storage on a shared volume. MinIO's public image is no longer
      # published, so Compose does not run an S3 service; point STORAGE_DRIVER=s3
      # at any S3-compatible endpoint to use that driver instead. The local driver
      # is single-host: every api/worker replica must mount the same volume.
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: /data/storage
      STORAGE_BUCKET: tender-documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - storage-data:/data/storage

volumes:
  postgres-data:
  redis-data:
  storage-data:
